<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

/* 🚨 FORCE REMOVE ANY WHITE FROM ANYWHERE */
html, body, div, section {
    background:#020617 !important;
}

/* 🔥 BODY FIX */
html, body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    position:relative;
    font-family:'Segoe UI';
    color:white;
}

/* 🔥 DARK BASE LAYER */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#020617;
    z-index:-1;
}

/* 🔥 CENTER */
body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 🔥 CANVAS */
#network{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:0;
}

/* 🔥 REMOVE UNKNOWN WHITE WRAPPERS */
body > *:not(canvas):not(.register-wrapper){
    background:transparent !important;
}

/* 🔥 WRAPPER FIX (MAIN FIX) */
.register-wrapper{
    position:relative;
    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:transparent !important;
}

/* 🔥 CARD */
.register-card{
    width:350px;
    padding:30px;
    border-radius:20px;

    background:rgba(15,23,42,0.95) !important;
    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 0 40px rgba(59,130,246,0.25),
        0 0 80px rgba(59,130,246,0.1);
}

/* 🔥 TITLE */
.register-title{
    text-align:center;
    margin-bottom:20px;
    font-size:26px;
    font-weight:bold;
    color:white;

    text-shadow:
        0 0 8px #60a5fa,
        0 0 16px #3b82f6;
}

/* 🔥 INPUT */
.input-group input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:10px;
    border:none;
    outline:none;

    background:rgba(255,255,255,0.08);
    color:white;
}

/* 🔥 BUTTON */
.register-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-weight:bold;

    box-shadow:0 0 20px rgba(59,130,246,0.6);
}

.register-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(59,130,246,1);
}

/* 🔥 OR TEXT */
.or-divider{
    text-align:center;
    margin:15px 0;
}

.or-divider span{
    color:#3b82f6;
}

/* 🔥 GOOGLE BUTTON */
.google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    padding:10px;
    border-radius:10px;

    background:#0f172a;
    border:1px solid rgba(255,255,255,0.1);

    color:white;
    text-decoration:none;
}

.google-btn img{
    width:18px;
}

/* 🔥 FORGOT PASSWORD */
.login-link{
    text-align:center;
    margin-top:12px;
}

.login-link a{
    color:white !important;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<canvas id="network"></canvas>

{% if session.get("user") %}
<div style="position:absolute; top:20px; right:20px;">
    <a href="/logout" style="background:red;padding:8px 12px;border-radius:8px;color:white;text-decoration:none;">
        🚪 Logout
    </a>
</div>
{% endif %}

<div class="register-wrapper">
    <div class="register-card">

        <h2 class="register-title">Login</h2>

        <form method="post">

            <div class="input-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password">
                <span onclick="togglePassword()" style="cursor:pointer;">👁️</span>
            </div>

            <button class="register-btn">Login</button>

            <div class="or-divider">
                <span>OR</span>
            </div>

            <a href="/login/google" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
                <span>Continue with Google</span>
            </a>

            <p class="login-link">
                <a href="/forgot-password">Forgot Password?</a>
            </p>

        </form>

    </div>
</div>

<script>
function togglePassword() {
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}

/* 🔥 PARTICLES */
const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        dx:(Math.random()-0.5)*0.3,
        dy:(Math.random()-0.5)*0.3
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fillStyle="white";
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });

    requestAnimationFrame(draw);
}

draw();
window.addEventListener("resize",resize);
</script>

</body>
</html>
