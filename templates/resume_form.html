<!DOCTYPE html>
<html>
<head>
<title>AI Resume Builder</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/resume.css') }}">

<style>

/* 🌌 BACKGROUND */
body{
    margin:0;
    font-family:'Segoe UI';
    background:#020617;
    color:white;
    overflow-x:hidden;
}

/* ✨ PARTICLES (NEW EFFECT) */
.particles{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.dot{
    position:absolute;
    width:4px;
    height:4px;
    background:#38bdf8;
    border-radius:50%;
    opacity:0.7;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* 🌈 GRADIENT GLOW */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle at 20% 30%, #2563eb33, transparent),
               radial-gradient(circle at 80% 70%, #22c55e22, transparent);
    z-index:-2;
}

/* 📦 FORM CONTAINER */
.form-container{
    width:90%;
    max-width:900px;
    margin:40px auto;
    padding:30px;
    border-radius:20px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);

    box-shadow:
        0 0 20px #2563eb,
        0 0 60px #2563eb;

    animation:fadeIn 1s ease;
}

/* ✨ FADE IN */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* 🔥 TITLE SHINE */
h1{
    text-align:center;
    margin-bottom:20px;

    background:linear-gradient(90deg,#38bdf8,#22c55e,#38bdf8);
    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 3s linear infinite;
}

@keyframes shine{
    0%{background-position:0%}
    100%{background-position:200%}
}

/* INPUTS */
input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background:#1e293b;
    color:white;

    transition:0.3s;
}

/* 🔥 INPUT FOCUS GLOW */
input:focus, textarea:focus{
    outline:none;
    box-shadow:0 0 10px #38bdf8;
    transform:scale(1.02);
}

/* ROW */
.row{
    display:flex;
    gap:10px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#6366f1;
    color:white;
    font-size:16px;

    transition:0.3s;
}

/* BUTTON HOVER */
button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #6366f1;
}

/* BUTTON CLICK */
button:active{
    transform:scale(0.95);
}

</style>

</head>

<body>

<!-- ✨ PARTICLES -->
<div class="particles" id="particles"></div>

<div class="form-container">

<h1>🚀 AI Resume Builder</h1>

<form action="/generate-resume" method="POST">

<div class="row">
<input type="text" name="name" placeholder="Full Name" required>
<input type="text" name="phone" placeholder="Phone Number" required>
<input type="email" name="email" placeholder="Email Address" required>
</div>

<div class="row">
<input type="text" name="linkedin" placeholder="LinkedIn URL">
<input type="text" name="github" placeholder="GitHub URL">
<input type="text" name="portfolio" placeholder="Portfolio URL">
</div>

<textarea name="summary" placeholder="Professional Summary"></textarea>
<textarea name="education" placeholder="Education Details"></textarea>
<textarea name="skills" placeholder="Technical Skills (comma separated)"></textarea>
<textarea name="projects" placeholder="Projects"></textarea>
<textarea name="experience" placeholder="Experience (if required)"></textarea>
<textarea name="internships" placeholder="Internships (if fresher)"></textarea>
<textarea name="certifications" placeholder="Certifications"></textarea>
<textarea name="achievements" placeholder="Achievements"></textarea>
<textarea name="additional_info" placeholder="Additional Information"></textarea>

<button type="submit">Generate Resume</button>

</form>

</div>

<!-- ✨ PARTICLE SCRIPT -->
<script>
const container = document.getElementById("particles");

for(let i=0;i<80;i++){
    let dot = document.createElement("div");
    dot.className = "dot";

    dot.style.left = Math.random()*100 + "vw";
    dot.style.animationDuration = (Math.random()*5 + 3) + "s";

    container.appendChild(dot);
}
</script>

</body>
</html>
