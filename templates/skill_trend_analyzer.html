<!DOCTYPE html>
<html>
<head>
    <title>Skill Demand Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <style>

        /* 🌌 BACKGROUND */
        body {
            font-family: 'Segoe UI', Arial;
            background: radial-gradient(circle at top, #020617, #020617);
            padding:20px;
            color:white;
            overflow-x:hidden;
        }

        #tsparticles{
            position:fixed;
            width:100%;
            height:100%;
            z-index:-1;
        }

        /* 🔥 FUTURISTIC CARD */
        .card {
            position: relative;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 18px;

            background: linear-gradient(145deg, rgba(10,20,40,0.8), rgba(2,6,23,0.95));
            border: 1px solid rgba(37,99,235,0.3);

            box-shadow:
                0 0 20px rgba(37,99,235,0.2),
                inset 0 0 20px rgba(37,99,235,0.1);

            overflow: hidden;
            transition: all 0.4s ease;
        }

        /* 🌈 GLOW BORDER */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 1px;

            background: linear-gradient(45deg, #2563eb, #00f2fe, #2563eb);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;

            opacity: 0.6;
            animation: borderGlow 4s linear infinite;
        }

        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* 🚀 HOVER EFFECT */
        .card:hover{
            transform: translateY(-10px) scale(1.03);
            box-shadow:
                0 0 40px rgba(0,242,254,0.5),
                0 0 80px rgba(37,99,235,0.3);
        }

        /* 🔵 BAR */
        .bar-container {
            background: rgba(255,255,255,0.08);
            height:12px;
            border-radius:10px;
            margin: 10px 0;
        }

        .bar {
            height:100%;
            background: linear-gradient(90deg,#00f2fe,#2563eb,#00f2fe);
            background-size: 200% 100%;
            animation: moveBar 3s linear infinite;
            border-radius:10px;
        }

        @keyframes moveBar {
            0% { background-position: 0% }
            100% { background-position: 200% }
        }

        /* 🧊 INPUTS */
        .input-group {
            margin-bottom: 20px;
        }

        input, select {
            padding:12px;
            margin:5px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.2);
            background:rgba(255,255,255,0.05);
            color:white;
            backdrop-filter: blur(10px);
        }

        input::placeholder{
            color:#aaa;
        }

        /* 🚀 BUTTON */
        button {
            padding:12px 20px;
            margin:5px;
            border-radius:10px;
            border:none;
            background: linear-gradient(45deg,#2563eb,#00f2fe);
            color:white;
            cursor:pointer;
            font-weight:bold;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:0 10px 25px rgba(37,99,235,0.5);
        }

        /* 🔥 HEADINGS */
        h1,h2{
            text-shadow:0 0 15px rgba(37,99,235,0.7);
        }

        /* 📊 CHART BOX */
        .chart-box{
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
        }

    </style>
</head>

<body>

    <div id="tsparticles"></div>

    <h2>🔮 AI Skill Generator</h2>

    <div class="input-group">
        <input type="text" id="roleInput" placeholder="Role (e.g. AI Engineer)">
        <input type="text" id="locInput" placeholder="Location">
        <input type="text" id="expInput" placeholder="Experience">

        <button onclick="generateAI()">Generate AI Skills</button>
        <button onclick="loadTrending()">Trending Skills</button>
    </div>

    <h1>📊 Skill Demand Analyzer</h1>

    <select id="categoryFilter" onchange="applyFilter()">
        <option value="All">All Categories</option>
        <option value="AI">AI</option>
        <option value="Frontend">Frontend</option>
        <option value="Backend">Backend</option>
        <option value="Cloud">Cloud</option>
        <option value="DevOps">DevOps</option>
    </select>

    <div id="skillsContainer"></div>

    <h2>📈 Demand Graph</h2>

    <div class="chart-box">
        <canvas id="skillChart"></canvas>
    </div>

    <script src="{{ url_for('static', filename='js/skills_analyzer.js') }}"></script>

    <!-- 🌌 PARTICLES -->
    <script>
        tsParticles.load("tsparticles", {
            particles: {
                number: { value: 90 },
                color: { value: "#00f2fe" },
                links: {
                    enable: true,
                    color: "#2563eb",
                    distance: 130
                },
                move: {
                    enable: true,
                    speed: 2
                },
                size: { value: 2 }
            },
            background: {
                color: "transparent"
            }
        });
    </script>

</body>
</html>
