<!DOCTYPE html>
<html>
<head>
<title>AI Career Insight</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI';
    background:#020617;
    color:white;
    overflow-y:auto;
}

/* 🌧️ RAIN BACKGROUND */
.rain{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.drop{
    position:absolute;
    width:2px;
    height:15px;
    background:#38bdf8;
    opacity:0.5;
    animation:rainFall linear infinite;
}

@keyframes rainFall{
    from{transform:translateY(-100px);}
    to{transform:translateY(100vh);}
}

/* MAIN */
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
    padding:60px 0;
}

/* FLOATING PANEL */
.panel{
    width:450px;
    padding:20px;
    border-radius:15px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);

    /* 🔵 GLOW */
    box-shadow:
        0 0 20px #2563eb,
        0 0 40px #2563eb;

    transition:0.3s;
}

.panel:hover{
    transform:scale(1.03);
}

/* TITLE */
h2{
    color:#38bdf8;
}

/* SCORE */
.score{
    font-size:45px;
    color:#22c55e;
}

/* TAGS */
.tag{
    display:inline-block;
    padding:6px 12px;
    margin:5px;
    border-radius:10px;
    background:#1e293b;
}

/* BAR */
.bar{
    height:10px;
    background:#1e293b;
    border-radius:10px;
    margin-top:10px;
}

.fill{
    height:100%;
    background:#22c55e;
    border-radius:10px;
}

/* BUTTON */
a{
    display:block;
    text-align:center;
    width:200px;
    padding:12px;
    background:#6366f1;
    border-radius:10px;
    text-decoration:none;
    color:white;
    margin-top:20px;
}
</style>

</head>

<body>

<!-- 🌧️ RAIN -->
<div class="rain" id="rain"></div>

<div class="container">

<div class="panel">
<h2>🎯 Career Path</h2>
<p>{{path}}</p>
</div>

<div class="panel">
<h2>📊 Match Score</h2>
<div class="score">{{score}}%</div>
<div class="bar">
<div class="fill" style="width:{{score}}%"></div>
</div>
</div>

<div class="panel">
<h2>🏢 Recommended Companies</h2>
<p>{{companies}}</p>
</div>

<div class="panel">
<h2>⚡ Skills to Improve</h2>
{% for skill in skills %}
<span class="tag">{{skill}}</span>
{% endfor %}
</div>

<a href="/profile">⬅ Back</a>

</div>

<script>
// 🌧️ RAIN
const rain = document.getElementById("rain");

for(let i=0;i<120;i++){
    let drop = document.createElement("div");
    drop.className = "drop";

    drop.style.left = Math.random()*window.innerWidth+"px";
    drop.style.animationDuration = (Math.random()*1+0.5)+"s";

    rain.appendChild(drop);
}
</script>

</body>
</html>
