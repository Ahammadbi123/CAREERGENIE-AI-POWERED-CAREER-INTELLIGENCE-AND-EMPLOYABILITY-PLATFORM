<!DOCTYPE html>
<html>
<head>
    <title>Optimized Resume</title>

    <style>
        body {
            background: #f3f4f6;
            font-family: Arial;
            padding: 40px;
        }

        .a4-container {
            width: 794px;
            min-height: 1123px;
            background: white;
            margin: auto;
            padding: 50px;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            position: relative;
        }

        .ats-circle {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #16a34a;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 {
            border-bottom: 2px solid #2563eb;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        ul {
            padding-left: 20px;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="a4-container">

    <div class="ats-circle" id="atsScore"></div>

    <h1 id="candidateName">Optimized Resume</h1>

    <div id="summarySection"></div>
    <div id="educationSection"></div>
    <div id="skillsSection"></div>
    <div id="projectsSection"></div>
    <div id="internshipSection"></div>
    <div id="experienceSection"></div>
    <div id="certificateSection"></div>
    <div id="achievementSection"></div>
    <div id="additionalSection"></div>

</div>

<script>

const data = JSON.parse(localStorage.getItem("optimizedResume"));

document.getElementById("atsScore").innerText = data.ats_score + "%";

/* ===============================
   Helper Function
=================================*/

function createSection(id, title, content) {
    if (!content || content.trim() === "") return;

    document.getElementById(id).innerHTML = `
        <h2>${title}</h2>
        <p>${content}</p>
    `;
}

/* ===============================
   Render Sections
=================================*/

createSection("summarySection", "Professional Summary", data.summary);
createSection("educationSection", "Education", data.education);
createSection("skillsSection", "Technical Skills", data.skills);
createSection("projectsSection", "Projects", data.projects);

/* Fresher vs Experience Logic */

if (data.internships) {
    createSection("internshipSection", "Internships", data.internships);
}

if (data.experience) {
    createSection("experienceSection", "Professional Experience", data.experience);
}

createSection("certificateSection", "Certifications", data.certificates);
createSection("achievementSection", "Achievements", data.achievements);
createSection("additionalSection", "Additional Information", data.additional_info);

</script>

</body>
</html>
