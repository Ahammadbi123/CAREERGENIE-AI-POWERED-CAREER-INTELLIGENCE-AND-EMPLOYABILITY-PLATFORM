<!DOCTYPE html>
<html>
<head>
    <title>Select Company</title>

    <!-- 🌌 PARTICLES -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <style>

        /* 🌌 BACKGROUND */
        body {
            font-family: Arial;
            background: radial-gradient(circle at top, #020617, #020617);
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        /* PARTICLES */
        #tsparticles{
            position:fixed;
            width:100%;
            height:100%;
            z-index:-1;
        }

        /* 🔥 HEADING FIX (WHITE + GLOW) */
        h1 {
            margin-top: 40px;
            font-size: 42px;
            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255,255,255,0.6),
                0 0 20px rgba(56,189,248,0.6),
                0 0 40px rgba(56,189,248,0.4);

            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse{
            from{
                text-shadow:0 0 10px #fff;
            }
            to{
                text-shadow:0 0 25px #38bdf8, 0 0 50px #38bdf8;
            }
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 50px;
            max-width: 1000px;
            margin: auto;
        }

        /* 💎 CARD */
        .card {
            background: linear-gradient(145deg, rgba(10,20,40,0.95), rgba(2,6,23,0.98));
            color: white;
            padding: 50px 20px;
            border-radius: 16px;

            position: relative;
            overflow: hidden;

            border: 1px solid rgba(37,99,235,0.3);

            box-shadow:
            0 0 20px rgba(56,189,248,0.2),
            inset 0 0 20px rgba(56,189,248,0.1);

            transition: all 0.4s ease;

            cursor: pointer;
            text-decoration: none;

            animation: fadeUp 0.6s ease forwards;
        }

        /* 🌈 GLOW BORDER */
        .card::before{
            content:"";
            position:absolute;
            inset:0;
            border-radius:16px;
            padding:1px;

            background: linear-gradient(45deg,#38bdf8,#7c3aed,#38bdf8);
            -webkit-mask:
            linear-gradient(#fff 0 0) content-box,
            linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;

            opacity:0.6;
            animation: borderGlow 4s linear infinite;
        }

        /* 🚀 3D HOVER */
        .card:hover {
            transform: translateY(-10px) scale(1.05) rotateX(5deg) rotateY(5deg);
            box-shadow:
            0 0 40px rgba(56,189,248,0.6),
            0 0 80px rgba(124,58,237,0.3);
        }

        /* TEXT */
        .card h2{
            color:#00f2fe;
            margin-bottom:15px;
        }

        /* BUTTON */
        .btn {
            margin-top: 15px;
            background: linear-gradient(45deg,#38bdf8,#7c3aed);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            display: inline-block;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover{
            transform: scale(1.1);
            box-shadow: 0 0 20px #38bdf8;
        }

        /* ✨ ENTRY */
        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* 🌈 BORDER ANIMATION */
        @keyframes borderGlow{
            0%{filter:hue-rotate(0deg);}
            100%{filter:hue-rotate(360deg);}
        }

    </style>
</head>

<body>

<!-- 🌌 PARTICLES -->
<div id="tsparticles"></div>

<h1>Select Company</h1>

<div class="grid">
{% for company in companies %}
    <a href="/company/{{ company['Company Name'] }}" class="card">
        <h2>{{ company["Company Name"] }}</h2>
        <div class="btn">View Analysis</div>
    </a>
{% endfor %}
</div>

<script>

/* 🌌 PARTICLES */
tsParticles.load("tsparticles", {
particles: {
number: { value: 100 },
color: { value: "#38bdf8" },
links: {
enable: true,
color: "#7c3aed",
distance: 130
},
move: {
enable: true,
speed: 2
},
size: { value: 2 }
},
background: { color: "transparent" }
});

</script>

</body>
</html>
