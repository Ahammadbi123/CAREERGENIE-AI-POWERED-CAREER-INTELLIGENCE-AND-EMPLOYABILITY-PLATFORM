<!DOCTYPE html>
<html>
<head>
    <title>Exam Dashboard</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: black;
    overflow: hidden;
}

/* 🔥 CANVAS */
#particles {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* 🔥 HEADING */
h1 {
    text-align: center;
    margin-top: 30px;
    color: white;
    font-size: 42px;
    position: relative;
    z-index: 2;
}

/* 🔥 CONTAINER */
.container {
    display: flex;
    justify-content: center;
    margin-top: 40px;
    position: relative;
    z-index: 2;
}

/* GRID */
.cards {
    display: grid;
    grid-template-columns: repeat(3, 220px);
    gap: 25px;
}

/* 🔥 RAINBOW GLOW CARD */
.card {
    position: relative;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    color: white;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);

    background-image: linear-gradient(270deg, 
        rgba(255,0,150,0.2),
        rgba(0,255,255,0.2),
        rgba(255,255,0,0.2),
        rgba(0,255,0,0.2)
    );
    background-size: 600% 600%;
    animation: gradientMove 8s ease infinite;

    transition: 0.4s;
    overflow: hidden;
}

/* GRADIENT MOVE */
@keyframes gradientMove {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

/* 🔥 NEON BORDER */
.card::before {
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:15px;
    background: linear-gradient(45deg,
        red, orange, yellow, green, cyan, blue, violet);
    z-index:-1;
    filter: blur(10px);
    animation: borderGlow 6s linear infinite;
}

@keyframes borderGlow {
    0% {filter:hue-rotate(0deg);}
    100% {filter:hue-rotate(360deg);}
}

/* 🔥 HOVER */
.card:hover {
    transform: scale(1.08) rotateX(5deg) rotateY(5deg);
    box-shadow: 0 0 40px rgba(255,255,255,0.3);
}

/* TITLE */
.card h3 {
    margin-bottom: 20px;
}

/* 🔥 RAINBOW BUTTON */
.card a {
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    color: black;

    background: linear-gradient(45deg,
        red, orange, yellow, green, cyan, blue, violet);

    background-size: 400%;
    animation: btnMove 5s linear infinite;
}

@keyframes btnMove {
    0% {background-position:0%}
    100% {background-position:100%}
}

.card a:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px white;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .cards {
        grid-template-columns: repeat(2, 200px);
    }
}

@media (max-width: 480px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<h1>Select Subject</h1>

<div class="container">
    <div class="cards">

        <div class="card"><h3>Python</h3><a href="/stages/python">Start Exam</a></div>
        <div class="card"><h3>Java</h3><a href="/stages/java">Start Exam</a></div>
        <div class="card"><h3>SQL</h3><a href="/stages/sql">Start Exam</a></div>
        <div class="card"><h3>C</h3><a href="/stages/c">Start Exam</a></div>
        <div class="card"><h3>C++</h3><a href="/stages/cpp">Start Exam</a></div>
        <div class="card"><h3>Aptitude</h3><a href="/stages/aptitude">Start Exam</a></div>
        <div class="card"><h3>Verbal</h3><a href="/stages/verbal">Start Exam</a></div>
        <div class="card"><h3>Mixed Exam</h3><a href="/stages/mixed">Start Exam</a></div>

    </div>
</div>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
let hue = 0;

/* CREATE PARTICLES */
for (let i = 0; i < 120; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        size: Math.random() * 2 + 1
    });
}

/* ANIMATE */
function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    hue += 1;

    particles.forEach((p, i) => {

        let color = `hsl(${hue + i * 3}, 100%, 60%)`;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        /* CONNECTION */
        for (let j = i; j < particles.length; j++) {
            let dx = p.x - particles[j].x;
            let dy = p.y - particles[j].y;
            let dist = dx * dx + dy * dy;

            if (dist < 12000) {
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 0.5;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
