<!DOCTYPE html>
<html>
<head>
    <title>Interview Result</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            font-family: Arial, sans-serif;
        }

        .result-card {
            background: white;
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .result-card h2 {
            margin-bottom: 20px;
        }

        .circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .badge {
            font-size: 18px;
            margin-top: 10px;
        }

        .btn {
            margin-top: 25px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

    </style>
</head>
<body>

<div class="result-card">

    <h2>🎉 Interview Result</h2>

    <div class="circle" id="scoreCircle">
        {{ average * 10 }}%
    </div>

    <div class="badge">
        🏆 Badge: <strong>{{ badge }}</strong>
    </div>

    <button class="btn" onclick="window.location.href='/mock-interview'">
        🔁 Try Again
    </button>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    let percentage = {{ average * 10 }};
    let circle = document.getElementById("scoreCircle");

    let color;

    if (percentage >= 80) {
        color = "#16a34a"; // Green
    }
    else if (percentage >= 50) {
        color = "#facc15"; // Yellow
    }
    else if (percentage < 30) {
        color = "#dc2626"; // Red
    }
    else {
        color = "#9ca3af"; // Gray
    }

    circle.style.background =
        `conic-gradient(${color} ${percentage * 3.6}deg, #e5e7eb 0deg)`;

});
</script>

</body>
</html>
