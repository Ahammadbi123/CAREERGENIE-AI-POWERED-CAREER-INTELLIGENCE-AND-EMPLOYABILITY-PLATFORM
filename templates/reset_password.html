<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

<style>

/* 🔥 DARK BACKGROUND */
html, body{
    margin:0;
    height:100%;
    background:#020617;
    overflow:hidden;
    font-family:'Segoe UI';
    color:white;
}

/* CENTER */
body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 🌌 PARTICLES */
#network{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* WRAPPER */
.forgot-wrapper{
    position:relative;
    z-index:2;
}

/* CARD */
.forgot-card{
    width:360px;
    padding:30px;
    border-radius:20px;

    background:#0f172a;
    border:1px solid rgba(255,255,255,0.08);

    box-shadow:0 0 30px rgba(59,130,246,0.2);
}

/* TITLE */
.forgot-card h2{
    text-align:center;
    margin-bottom:10px;

    text-shadow:
        0 0 5px rgba(255,255,255,0.6),
        0 0 15px rgba(59,130,246,0.5);
}

/* EMAIL */
.reset-email{
    text-align:center;
    color:#94a3b8;
    margin-bottom:20px;
}

/* INPUT GROUP */
.input-group{
    position:relative;
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;

    background:#1e293b;
    color:white;
}

/* 👁 TOGGLE */
.toggle-eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

/* BUTTON */
.btn-primary{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-weight:bold;

    box-shadow:0 0 15px rgba(59,130,246,0.5);
}

.btn-primary:hover{
    transform:scale(1.05);
}

</style>
</head>

<body>

<canvas id="network"></canvas>

<div class="forgot-wrapper">
    <div class="forgot-card">

        <h2>Reset Password</h2>
        <p class="reset-email">{{ email }}</p>

        <form method="post">

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="New Password" required>
                <span class="toggle-eye" onclick="togglePassword('password', this)">👁</span>
            </div>

            <div class="input-group">
                <input type="password" id="confirm" name="confirm_password" placeholder="Confirm Password" required>
                <span class="toggle-eye" onclick="togglePassword('confirm', this)">👁</span>
            </div>

            <button type="submit" class="btn-primary">
                Update Password
            </button>

        </form>

    </div>
</div>

<script>
function togglePassword(id, el) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        el.textContent = "🙈";
    } else {
        input.type = "password";
        el.textContent = "👁";
    }
}

/* 🌌 PARTICLES */
const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

let particles = [];

/* more visible */
for(let i=0;i<100;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        dx:(Math.random()-0.5)*0.6,
        dy:(Math.random()-0.5)*0.6
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,2.2,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,0.9)";
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });

    requestAnimationFrame(draw);
}

draw();
window.addEventListener("resize",resize);
</script>

</body>
</html>
